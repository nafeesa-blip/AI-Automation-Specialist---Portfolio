<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef3fd"/></linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f97316"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f1b2d" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1600" height="760" rx="28" fill="url(#bg)"/>
  <text x="60" y="78" font-size="34" font-weight="800" fill="#0f1b2d">Project Mila · LLM data generation pipeline</text>
  <text x="60" y="114" font-size="19" fill="#5a6a7f">Raw English articles in, 1.5M validated multiple-choice reading comprehension Q&amp;A pairs out</text>

  <g stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#ar)">
    <path d="M247 300H271"/><path d="M465 300H489"/><path d="M683 300H707"/><path d="M901 300H925"/><path d="M1119 300H1143"/><path d="M1337 300H1361"/>
  </g>
  <path d="M1022 392 C1022 470 1022 470 960 470 H866 C804 470 804 470 804 392" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ao)"/>
  <rect x="826" y="452" width="174" height="36" rx="18" fill="#fff7ed" stroke="#fdba74"/>
  <text x="913" y="476" font-size="15" font-weight="700" fill="#c2410c" text-anchor="middle">Retry queue</text>
  <text x="913" y="512" font-size="14" fill="#9a3412" text-anchor="middle">temp 0.9 → 0.7 · stricter prompt</text>

  <g filter="url(#sh)">
    <g transform="translate(55 210)"><rect width="192" height="180" rx="18" fill="#fff" stroke="#dbe5f3"/><text x="20" y="42" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="1.5">01 · INPUT</text><text x="20" y="74" font-size="21" font-weight="800" fill="#0f1b2d">Raw articles</text><text x="20" y="104" font-size="14" fill="#5a6a7f">English articles</text><text x="20" y="126" font-size="14" fill="#5a6a7f">batched 1,000</text><text x="20" y="148" font-size="14" fill="#5a6a7f">at a time</text></g>
    <g transform="translate(273 210)"><rect width="192" height="180" rx="18" fill="#fff" stroke="#dbe5f3"/><text x="20" y="42" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="1.5">02 · PROMPT</text><text x="20" y="74" font-size="21" font-weight="800" fill="#0f1b2d">Prompt design</text><text x="20" y="104" font-size="14" fill="#5a6a7f">7 questions,</text><text x="20" y="126" font-size="14" fill="#5a6a7f">4 skill types, banned</text><text x="20" y="148" font-size="14" fill="#5a6a7f">question starters</text></g>
    <g transform="translate(491 210)"><rect width="192" height="180" rx="18" fill="url(#hot)"/><text x="20" y="42" font-size="13" font-weight="700" fill="#bfdbfe" letter-spacing="1.5">03 · INFERENCE</text><text x="20" y="74" font-size="21" font-weight="800" fill="#fff">vLLM</text><text x="20" y="104" font-size="14" fill="#dbeafe">gpt-oss-20b on GPU</text><text x="20" y="126" font-size="14" fill="#dbeafe">prefix caching,</text><text x="20" y="148" font-size="14" fill="#dbeafe">bfloat16</text></g>
    <g transform="translate(709 210)"><rect width="192" height="180" rx="18" fill="#fff" stroke="#dbe5f3"/><text x="20" y="42" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="1.5">04 · PARSE</text><text x="20" y="74" font-size="21" font-weight="800" fill="#0f1b2d">JSON repair</text><text x="20" y="104" font-size="14" fill="#5a6a7f">5 strategies: escaping,</text><text x="20" y="126" font-size="14" fill="#5a6a7f">commas, truncation,</text><text x="20" y="148" font-size="14" fill="#5a6a7f">incomplete objects</text></g>
    <g transform="translate(927 210)"><rect width="192" height="180" rx="18" fill="#fff" stroke="#dbe5f3"/><text x="20" y="42" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="1.5">05 · VALIDATE</text><text x="20" y="74" font-size="21" font-weight="800" fill="#0f1b2d">Validation</text><text x="20" y="104" font-size="14" fill="#5a6a7f">required fields,</text><text x="20" y="126" font-size="14" fill="#5a6a7f">exactly 4 options,</text><text x="20" y="148" font-size="14" fill="#5a6a7f">answer A–D</text></g>
    <g transform="translate(1145 210)"><rect width="192" height="180" rx="18" fill="#fff" stroke="#dbe5f3"/><text x="20" y="42" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="1.5">06 · CLEAN</text><text x="20" y="74" font-size="21" font-weight="800" fill="#0f1b2d">Clean &amp; enrich</text><text x="20" y="104" font-size="14" fill="#5a6a7f">HTML strip, anonymize,</text><text x="20" y="126" font-size="14" fill="#5a6a7f">domain, stage, type,</text><text x="20" y="148" font-size="14" fill="#5a6a7f">word count, hash ID</text></g>
    <g transform="translate(1363 210)"><rect width="182" height="180" rx="18" fill="#0b1a33"/><text x="20" y="42" font-size="13" font-weight="700" fill="#93c5fd" letter-spacing="1.5">07 · OUTPUT</text><text x="20" y="80" font-size="34" font-weight="800" fill="#fff">1.5M</text><text x="20" y="108" font-size="15" fill="#dbeafe">Q&amp;A pairs</text><text x="20" y="134" font-size="14" fill="#93c5fd">JSON + CSV</text><text x="20" y="156" font-size="14" fill="#93c5fd">+ error report</text></g>
  </g>

  <g transform="translate(55 580)">
    <rect width="1490" height="120" rx="18" fill="#fff" stroke="#dbe5f3"/>
    <text x="28" y="44" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="1.5">RUNS ACROSS EVERY STAGE</text>
    <g font-size="16" fill="#0f1b2d" font-weight="600">
      <circle cx="36" cy="80" r="6" fill="#22c55e"/><text x="52" y="86">Error tracker: parse errors, repairs, retries</text>
      <circle cx="476" cy="80" r="6" fill="#22c55e"/><text x="492" y="86">Checkpoints to Google Drive</text>
      <circle cx="790" cy="80" r="6" fill="#22c55e"/><text x="806" y="86">GPU memory cleanup between stages</text>
      <circle cx="1146" cy="80" r="6" fill="#22c55e"/><text x="1162" y="86">7 Qs per article · 4 skill types</text>
    </g>
  </g>
</svg>
